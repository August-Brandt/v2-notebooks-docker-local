[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "itu-sdse-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.59",
    "joblib>=1.0.0",
    "mlflow>=2.0.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "pillow>=9.0.0",
    "scikit-learn>=1.0.0",
    "scipy>=1.7.0",
    "torch>=2.13.0",
    "torchvision>=0.15.0",
    "typing-extensions>=4.0.0",
    "xgboost>=1.6.0",
]

# Ship `src` as a proper top-level package. Without this, setuptools'
# src-layout auto-discovery installs the *contents* of src/ (config, data,
# deployment, ...) as top-level modules, and the pickled pyfunc model - which
# references `src.deployment.logging_wrapper` - cannot be unpickled from the
# installed package alone.
[tool.setuptools]
packages = ["src", "src.data", "src.deployment", "src.models"]


